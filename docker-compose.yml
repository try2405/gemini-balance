version: '3'

services:
  gemini-balance:
    build: .
    container_name: gemini_balance
    ports:
      - "7081:8000"
    env_file:
      - .env
    depends_on:
      - gemini_sql

  gemini_sql:
    image: mysql:8.0
    container_name: gemini_sql
    environment:
      MYSQL_ROOT_PASSWORD: your_mysql_root_password
      MYSQL_USER: your_mysql_user
      MYSQL_PASSWORD: your_mysql_password
      MYSQL_DATABASE: default_db
    volumes:
      - ./sort_buffer.cnf:/etc/mysql/conf.d/sort_buffer.cnf 
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:  # 定义持久化数据卷
